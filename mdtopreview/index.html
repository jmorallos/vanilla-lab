<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Markdown to HTML Converter</title>
    <link rel="stylesheet" href="./styles.css">
</head>

<body>
    <h1>Markdown to HTML Converter</h1>
    
    <div class="converter" id="container">
        <section class="converter__panel converter__panel--input">
            <h2>Markdown Input:</h2>
            <textarea class="converter__textarea" id="markdown-input" placeholder="Enter your markdown here..."></textarea>
        </section>
    
        <section class="converter__panel converter__panel--output">
            <h2>Raw HTML Output:</h2>
            <div class="converter__output" id="html-output"></div>
        </section>
    
        <section class="converter__panel converter__panel--preview">
            <h2>HTML Preview:</h2>
            <div class="converter__preview" id="preview"></div>
        </section>
    </div>
    <script src="./script.js"></script>
</body>

</html>
