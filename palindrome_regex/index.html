<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Palindrome Checker</title>
    <link rel="stylesheet" href="./styles.css" />
</head>

<body>
    <div id="app">
        <strong><a href="https://github.com/jmorallos" target="_blank" rel="noreferrer noopener">jmorallos@github.com</a></strong>
        <h1>Is it a Palindrome?</h1>
        <div class="card">
            <div class="checker-container">
                <input class="checker-container__txt-input" id="text-input" type="text"
                    placeholder="type here to check for palindrome" />
                <button class="checker-container__check-btn" id="check-btn">Check</button>
            </div>

            <div class="result-container">
                <p class="result-container__result" id="result"></p>
            </div>
        </div>

        <div class="card">
            <p class="card__defination">
                A <em>palindrome</em> is a word or phrase that can be read the same way forwards and backwards, ignoring punctuation, case, and
                spacing.
            </p>
        </div>

        <script type="module" src="./script.js"></script>
</body>

</html>
